[package]
name = "comport"
version = "0.1.0"
description = "Native Mattermost and Microsoft Teams client"
keywords = ["chat", "mattermost", "teams", "egui", "blade"]
categories = ["gui"]
license = "MIT"
repository = "https://github.com/navigato-rs/comport"
authors = ["Dzmitry Malyshau"]
edition = "2024"
# Starcom is 1.96; FileMan is 1.95. Stay on FileMan's MSRV until a dependency forces a bump.
rust-version = "1.95"
default-run = "comport"

[package.metadata.bundle]
name = "ComPort"
identifier = "com.comport.app"
icon = ["etc/comport.svg"]

[package.metadata.deb]
maintainer = "Dzmitry Malyshau"
section = "net"
assets = [
    ["target/release/comport", "usr/bin/comport", "755"],
    ["etc/comport.desktop", "usr/share/applications/comport.desktop", "644"],
    ["etc/comport.svg", "usr/share/icons/hicolor/scalable/apps/comport.svg", "644"],
    ["etc/comport.png", "usr/share/icons/hicolor/256x256/apps/comport.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/comport", dest = "/usr/bin/comport", mode = "755" },
    { source = "etc/comport.desktop", dest = "/usr/share/applications/comport.desktop", mode = "644" },
    { source = "etc/comport.svg", dest = "/usr/share/icons/hicolor/scalable/apps/comport.svg", mode = "644" },
    { source = "etc/comport.png", dest = "/usr/share/icons/hicolor/256x256/apps/comport.png", mode = "644" },
]

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
png = "0.18"
blade-egui = { version = "0.8.1", git = "https://github.com/kvark/blade", rev = "f1fbf2a" }
blade-graphics = { version = "0.8.4", git = "https://github.com/kvark/blade", rev = "f1fbf2a" }
egui = "0.34"
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "wayland", "x11"] }
winit = "0.30.5"
rustls = { version = "=0.23.44", default-features = false, features = ["std"] }
rustls-rustcrypto = { version = "0.0.2-alpha", git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "70f76c039e587192688af18a80d5d6435dedaf22", default-features = false, features = ["std", "zeroize"] }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls-no-provider"] }
rustls-native-certs = "0.8"
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
p256 = { version = "0.14", default-features = false, features = ["ecdh"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gles)'] }

[profile.release]
lto = "thin"
strip = true

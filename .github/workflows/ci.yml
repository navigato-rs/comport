name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch advisories filed against a lockfile nobody touched.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Native crypto dependency policy
        run: |
          python scripts/check-dependencies.py
          python -m unittest discover -s scripts -p test_dependency_policy.py
      - name: Build
        run: cargo build --locked --all-features --all-targets
      - name: Test
        run: cargo test --locked --all-features --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

  # The declared rust-version is a promise to packagers. Build it, or it is a guess.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - name: Build and test at the declared minimum
        run: |
          cargo build --locked --all-features --all-targets
          cargo test --locked --all-features --all-targets

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Advisories, bans, licenses, and sources
        run: cargo deny --all-features check
